# Publishes the installable web app to GitHub Pages.
# Runs on every push to main so the web version never falls behind.
# Build and deploy are separate jobs (GitHub's recommended layout): the deploy job
# only starts once the uploaded site is registered, which avoids "No artifacts named
# github-pages were found" when deploy runs in the same job straight after upload.
name: Web app
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: mkdir site && cp index.html privacy.html support.html manifest.webmanifest icon.svg icon-192.png icon-512.png apple-touch-icon.png sw.js site/
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
